<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INVUL</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
background:#000;
display:flex;
align-items:center;
justify-content:center;
font-family:Arial,sans-serif;
overflow:hidden;
}

.container{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:16px;
width:100%;
height:100vh;
text-align:center;
}

.logo{
width:min(98vw,1536px);
height:auto;
max-height:min(84vh,1024px);
object-fit:contain;

image-rendering:-webkit-optimize-contrast;
image-rendering:high-quality;

opacity:0;
animation:logoFade 1.4s ease forwards;
animation-delay:.6s;
}

.invul-text,.line,.text{
transform:translateY(-22px);
}

@keyframes logoFade{
to{opacity:1;}
}

@media (max-width:600px){
.logo{
width:min(96vw,1536px);
max-height:min(70vh,1024px);
}
}
</style>
</head>
<body>

<div class="container">
<img class="logo" src="/invul.png" alt="INVUL Logo">
</div>

</body>
</html>
